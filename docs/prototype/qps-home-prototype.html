<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QPS Home Prototype</title>
<style>
:root{
  --brand:#ed018b; --primary:#d4007c; --blue:#0f6cb1; --blue-dark:#0a4a7d;
  --ink:#1d1a24; --muted:#625c6b; --line:#e8e3ec; --bg:#f6f4f7; --card:#fff;
  --ok:#1f8a5c; --ok-bg:#e1f4ea; --warn:#9a6200; --warn-bg:#fdf1dc; --bad:#b4233c; --bad-bg:#fbe4e8; --info-bg:#e3f0fa;
  --pink-bg:#fde6f3;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,select{font:inherit}
/* ---------- prototype control bar (not part of the app) ---------- */
.proto{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px;background:#211b29;color:#efe9f3;font-size:13px}
.proto b{color:#fff}
.proto label{display:flex;align-items:center;gap:6px}
.proto select{padding:5px 8px;border-radius:6px;border:1px solid #4a4056;background:#2d2537;color:#fff}
.proto .route{margin-left:auto;font-family:Consolas,ui-monospace,monospace;font-size:12.5px;background:#2d2537;padding:5px 10px;border-radius:6px}
.proto .route em{color:#ff9ad5;font-style:normal}
/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:264px 1fr;grid-template-rows:64px 1fr;min-height:calc(100vh - 52px)}
.appbar{grid-column:1/-1;position:relative;display:flex;align-items:center;gap:12px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line)}
.appbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:linear-gradient(90deg,var(--brand),var(--blue))}
.iconbtn{display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:50%;background:none;cursor:pointer;color:var(--ink)}
.iconbtn:hover{background:#f4eef6}
.brand{display:flex;align-items:center;gap:10px}
.brand img{height:30px;display:block}
.brand span{padding-left:10px;border-left:1px solid var(--line);font-weight:800;letter-spacing:.08em;color:var(--blue)}
.spacer{flex:1}
.userchip{display:flex;align-items:center;gap:10px;padding:4px 10px 4px 4px;border-radius:999px;cursor:default}
.avatar{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--blue));color:#fff;font-size:13px;font-weight:700}
.userchip .n{font-weight:600;line-height:1.2}
.userchip .s{font-size:12px;color:var(--muted);line-height:1.2}
/* ---------- drawer ---------- */
.drawer{background:#fff;border-right:1px solid var(--line);padding:12px 10px 20px;overflow-y:auto;display:flex;flex-direction:column}
.navlink,.navgroup>summary{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none;cursor:pointer;user-select:none}
.navlink:hover,.navgroup>summary:hover{background:#f7f2f9}
.navlink.active{background:var(--pink-bg);color:var(--primary);font-weight:600}
.navlink svg,.navgroup>summary svg{width:20px;height:20px;fill:currentColor;flex:none;opacity:.85}
.navgroup{margin:1px 0}
.navgroup>summary{list-style:none;font-weight:600}
.navgroup>summary::-webkit-details-marker{display:none}
.navgroup>summary .chev{margin-left:auto;transition:transform .15s}
.navgroup[open]>summary .chev{transform:rotate(180deg)}
.navgroup .items{padding-left:32px}
.navgroup .items .navlink{padding:7px 12px;font-size:13.5px}
.navgroup .navgroup .items{padding-left:14px}
.navsection{margin:16px 12px 4px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.drawer .foot{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
/* ---------- page ---------- */
main{padding:26px 28px 32px;display:flex;flex-direction:column;gap:20px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.greet{font-size:13px;font-weight:600;color:var(--blue)}
h1{margin:2px 0 0;font-size:26px;line-height:1.2}
.sub{margin:4px 0 0;color:var(--muted);max-width:62ch}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badge{padding:4px 10px;border-radius:999px;border:1px dashed #d8b4ca;background:#fff;color:var(--primary);font-size:12px;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:8px;border:1px solid transparent;font-weight:600;font-size:13.5px;cursor:pointer}
.btn svg{width:18px;height:18px;fill:currentColor}
.btn.p{background:var(--primary);color:#fff;box-shadow:0 2px 6px rgba(212,0,124,.25)}
.btn.o{background:#fff;border-color:#b9d3ea;color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.kpi{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;background:#fff;border:1px solid var(--line);border-radius:12px}
.kpi .ic{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;flex:none}
.kpi .ic svg{width:22px;height:22px;fill:currentColor}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-size:28px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .nt{font-size:12px;color:var(--muted)}
.t-pink .ic{background:var(--pink-bg);color:var(--primary)} .t-blue .ic{background:var(--info-bg);color:var(--blue)}
.t-green .ic{background:var(--ok-bg);color:var(--ok)} .t-amber .ic{background:var(--warn-bg);color:var(--warn)} .t-red .ic{background:var(--bad-bg);color:var(--bad)}
.grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:14px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel>header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line)}
.panel h2{margin:0;font-size:15px}
.panel .lnk{color:var(--primary);font-size:13px;text-decoration:none;cursor:pointer}
.panel .body{padding:6px 18px 14px}
.tw{overflow-x:auto;margin:0 -18px}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 18px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 18px;border-bottom:1px solid #f1edf3;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fbf8fc}
.num{font-variant-numeric:tabular-nums}
.st{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.st.ok{background:var(--ok-bg);color:var(--ok)} .st.bad{background:var(--bad-bg);color:var(--bad)} .st.info{background:var(--info-bg);color:var(--blue)} .st.wait{background:var(--warn-bg);color:var(--warn)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #f1edf3}
.list li:last-child{border-bottom:0}
.list small{color:var(--muted)}
.bars{list-style:none;margin:8px 0 6px;padding:0;display:grid;gap:9px}
.bars li{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;font-size:13px}
.track{height:10px;border-radius:5px;background:#eef2f7;overflow:hidden;position:relative}
.fill{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--blue)}
.bars .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.hint{margin:6px 0 0;color:var(--muted);font-size:12.5px}
.placeholder{background:#fff;border:1px dashed #cdbfd6;border-radius:12px;padding:40px 24px;text-align:center;color:var(--muted)}
.placeholder code{background:var(--bg);padding:2px 6px;border-radius:4px;color:var(--ink)}
.appfoot{display:flex;justify-content:center;gap:12px;padding:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.appfoot span:last-child{color:var(--blue)}
.tip{position:fixed;pointer-events:none;background:#211b29;color:#fff;font-size:12px;padding:5px 8px;border-radius:6px;opacity:0;transition:opacity .1s;z-index:60}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .drawer{position:fixed;top:0;bottom:0;left:0;width:264px;z-index:60;transform:translateX(-100%);transition:transform .2s;box-shadow:0 8px 24px rgba(0,0,0,.15)}
  .app.open .drawer{transform:none}
  .grid2{grid-template-columns:1fr}
  main{padding:18px 16px 24px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi{flex-direction:column;gap:8px;padding:14px}
  .kpi .v{font-size:24px}
  .userchip .txt{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  const isAdmin=is('1'),isBuyer=is('2'),isQC=is('3'),isView=is('4'),isQA=is('1006'),isQAM=is('1007'),isQAAdmin=is('1008'),
        isCH=is('1010'),isACH=is('1011'),isMerch=is('1012'),isASN=is('1014'),isVendor=is('Vendor');
  const groups=[];
  const add=(title,icon,items)=>{ // merge groups with the same title, drop duplicate links
    let g=groups.find(x=>x.title===title);
    if(!g){g={title,icon,items:[]};groups.push(g);}
    for(const it of items) if(!g.items.some(x=>x.h&&x.h===it.h&&!x.items)) g.items.push(it);
  };
  const std=[L('All','/AllRecPenOngInspections'),L('Submitted','/InspectionList'),L('Pending','/PendingInspectionListNew'),L('Report','/InspectionsReportNew'),L('Cancelled','/CanceledInspections'),L('ASN Generated','/AsnGenList')];
  if(isQAM||isQAAdmin||isMerch||isQA||isVendor||isACH||isCH||isBuyer){
    const it=[];
    if(isQAM||isQAAdmin||isMerch) it.push(L('All','/AllRecPenOngInspections'),L('Received','/InspectionList'),L('Ongoing','/OngoingInspections'),L('Pending','/PendingInspectionListNew'),L('Report','/InspectionsReportNew'),L('Cancelled','/CanceledInspections'),{t:'ASN',items:[L('ASN Generated','/AsnGenList')]});
    if(isQAAdmin) it.push(L('Bulk Download','/bulk-download'));
    if(isQA) it.push(L('Ongoing','/OngoingInspections'),L('Pending','/PendingInspectionListNew'),L('Report','/InspectionsReportNew'),L('Failed','/FailedInspections'));
    if(isVendor) it.push(...std);
    if(isACH||isCH||isBuyer) it.push(...std);
    add('Inspection Requests','insp',it);
  }
  if(isASN) add('ASN','truck',[L('ASN Request','/AsnReqList'),L('ASN Generated','/AsnGenList')]);
  if(isQAAdmin) add('Audit Requests','audit',[L('New Vendor(s)','/NewAuditRequests'),L('Old Vendor(s)','/OldAuditRequests')]);
  if(isQAAdmin||isAdmin||isBuyer||isQC||isView||isMerch) add('PPS','shirt',[L('PPS Requests','/pps-list')]);
  if(isQAM||isQAAdmin) add('Vendor Management','store',[L('Vendor Onboard','/VendorOnBoarding'),L('Reset Password','/resetpassword')]);
  if(isQAAdmin) add('Master Data','tune',[L('Email Management','/emailList'),L('Color Codes','/colorCodeList'),L('QA Location','/QAMaster'),L('Hierarchy','/HierarchyList')]);
  if(mod.um){
    add('Settings','gear',[L('User Management','/User-Master'),L('User Roles','/Role-Master'),L('Vendor Management','/Vendor-Master'),L('Reset Password','/resetpassword')]);
    add('Audit Requests','audit',[L('New Vendor(s)','/NewAuditRequests'),L('Old Vendor(s)','/OldAuditRequests'),L('Audit Wizard','/audit/new'),L('Bulk Download','/bulk-download')]);
  }
  if(mod.menu) add('Menu','menu',[L('Edit','/Menu-Master'),L('Quality manual','/Menu-Master?page=12'),{t:'SOPs',items:[L('Inspection SOP','/Menu-Master?page=21'),L('Packing SOP','/Menu-Master?page=22')]}]);
  return groups;
}

// ---------- rendering ----------
const stClass=s=>{s=s.toLowerCase();return /pass|approv|deliver|active|done|generated/.test(s)?'ok':/fail|reject|overdue|locked|cancel/.test(s)?'bad':/progress|transit|ongoing|received/.test(s)?'info':'wait'};
const chip=s=>s?`<span class="st ${stClass(s)}">${esc(s)}</span>`:'';
function renderSide(s){
  if(s.type==='bars'){
    const max=s.max||Math.max(...s.data.map(d=>d[1]));
    return `<ul class="bars">${s.data.map(([k,v])=>`<li data-tip="${esc(k)}: ${v}${s.suffix||''}"><span>${esc(k)}</span><span class="track"><span class="fill" style="width:${(v/max*100).toFixed(1)}%"></span></span><span class="v">${v}${s.suffix||''}</span></li>`).join('')}</ul>${s.hint?`<p class="hint">${esc(s.hint)}</p>`:''}`;
  }
  return `<ul class="list">${s.data.map(([a,b,c])=>`<li><span><b>${esc(a)}</b><br><small>${esc(b)}</small></span>${chip(c)}</li>`).join('')}</ul>`;
}
function renderDashboard(comp,user){
  const d=DASH[comp];
  const first=user.name.split(' ')[0];
  const h=new Date().getHours(), greet=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  const statusCol=d.main.cols.length-1;
  return `
  <div class="head">
    <div><div class="greet">${greet}, ${esc(first)}</div><h1>${esc(d.title)}</h1><p class="sub">${esc(d.sub)}</p></div>
    <div class="actions">${d.badge?`<span class="badge" style="color:var(--blue);border-color:#b9d3ea">${esc(d.badge)}</span>`:''}<span class="badge" title="Figures are examples, not live data">Prototype · sample data</span>${d.actions.map(([k,i,t])=>`<button class="btn ${k}">${svg(i)}${esc(t)}</button>`).join('')}</div>
  </div>
  ${d.note?`<div class="placeholder" style="padding:12px 16px;text-align:left;border-color:#e3c38a;background:#fffaf0;color:#7a5200">${esc(d.note)}</div>`:''}
  <div class="kpis">${d.kpis.map(([l,v,n,t,i])=>`<div class="kpi t-${t}"><div class="ic">${svg(i)}</div><div><div class="l">${esc(l)}</div><div class="v">${esc(v)}</div>${n?`<div class="nt">${esc(n)}</div>`:''}</div></div>`).join('')}</div>
  <div class="grid2">
    <section class="panel"><header><h2>${esc(d.main.title)}</h2>${d.main.link?`<a class="lnk" data-href="${d.main.link}">View all</a>`:''}</header>
      <div class="body"><div class="tw"><table><thead><tr>${d.main.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead>
      <tbody>${d.main.rows.map(r=>`<tr>${r.map((c,i)=>i===statusCol&&d.main.cols[i]==='Status'?`<td>${chip(c)}</td>`:`<td class="${/^\d|^[A-Z]{2}-/.test(c)?'num':''}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div></section>
    <section class="panel"><header><h2>${esc(d.side.title)}</h2>${d.side.link?`<a class="lnk" data-href="${d.side.link}">View all</a>`:''}</header><div class="body">${renderSide(d.side)}</div></section>
  </div>`;
}
function renderMenu(groups,active){
  const link=(it)=>`<a class="navlink${it.h===active?' active':''}" data-href="${it.h}">${esc(it.t)}</a>`;
  const item=it=>it.items?`<details class="navgroup" open><summary>${esc(it.t)}${svg('chev').replace('<svg','<svg class="chev"')}</summary><div class="items">${it.items.map(item).join('')}</div></details>`:link(it);
  return `<a class="navlink${active==='/'?' active':''}" data-href="/">${svg('home')}Home</a>
    ${groups.map(g=>`<details class="navgroup" ${g.items.some(i=>i.h===active||i.items?.some(x=>x.h===active))||groups.length<=3?'open':''}><summary>${svg(g.icon)}${esc(g.title)}${svg('chev').replace('<svg','<svg class="chev"')}</summary><div class="items">${g.items.map(item).join('')}</div></details>`).join('')}
    <div class="foot"><a class="navlink" data-href="#logout">${svg('logout')}Sign out</a></div>`;
}

let state={persona:PERSONAS[0],path:'/'};
const $=id=>document.getElementById(id);
function render(){
  const p=state.persona, mod={um:$('modUm').checked,menu:$('modMenu').checked};
  const prim=primaryRole(p.roles), comp=COMPONENT[prim];
  $('uname').textContent=p.name;
  $('urole').textContent=p.vendor?'Vendor':p.label.replace(/ · /,' (')+(p.label.includes(' · ')?')':'');
  $('avatar').textContent=p.name.split(' ').slice(0,2).map(s=>s[0]).join('').toUpperCase();
  $('drawer').innerHTML=renderMenu(buildMenu(p.roles,mod),state.path);
  if(state.path==='/'){
    $('main').innerHTML=renderDashboard(comp,p);
    $('route').innerHTML=`Route <em>/</em> → Home.razor renders <em>&lt;${comp} /&gt;</em>${prim!=='Vendor'&&prim!=='none'?` · primary role ${prim}`:''}`;
  }else{
    $('main').innerHTML=`<div class="placeholder"><h1 style="color:var(--ink)">Existing QPS page</h1><p>This menu item opens <code>${esc(state.path)}</code>, one of your current pages. It isn't part of this prototype.</p><p><button class="btn p" data-href="/">${svg('home')}Back to Home</button></p></div>`;
    $('route').innerHTML=`Route <em>${esc(state.path)}</em> → existing page`;
  }
}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-href]'); if(!a) return;
  e.preventDefault();
  const h=a.dataset.href;
  if(h==='#logout'){ $('main').innerHTML=`<div class="placeholder"><h1 style="color:var(--ink)">Sign out</h1><p>Posts the sign-out form and returns to <code>/Account/Login?reason=signedout</code>.</p><p><button class="btn p" data-href="/">${svg('home')}Back to Home</button></p></div>`; return; }
  state.path=h; render(); $('app').classList.remove('open');
});
$('toggle').addEventListener('click',()=>$('app').classList.toggle('open'));
const sel=$('persona');
sel.innerHTML=PERSONAS.map(p=>`<option value="${p.id}">${esc(p.name)} — ${esc(p.label)}</option>`).join('');
sel.addEventListener('change',()=>{state.persona=PERSONAS.find(p=>p.id===sel.value);state.path='/';$('modUm').checked=!!state.persona.um;render();});
['modUm','modMenu'].forEach(id=>$(id).addEventListener('change',render));
// tooltips on bars
const tip=$('tip');
document.addEventListener('mousemove',e=>{const t=e.target.closest('[data-tip]');if(!t){tip.style.opacity=0;return;}tip.textContent=t.dataset.tip;tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY+12)+'px';tip.style.opacity=1;});
render();
</script>
